plugins {
    id 'com.android.application'
}

// ── 서명 열쇠 · release signing ──────────────────────────────────────────
// Read from android/keystore.properties (gitignored), or from the environment
// so a CI box can sign without a file on disk. Both are optional: with neither,
// assembleRelease still builds and simply leaves the artifact unsigned. That is
// deliberate — anyone who clones this repo must be able to build it, and only
// the person holding the upload key can produce something the Play Store will
// take. See android/keystore.properties.example.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signStoreFile = keystoreProps['storeFile'] ?: System.getenv('WORKLOG_STORE_FILE')
def signStorePass = keystoreProps['storePassword'] ?: System.getenv('WORKLOG_STORE_PASSWORD')
def signKeyAlias  = keystoreProps['keyAlias'] ?: System.getenv('WORKLOG_KEY_ALIAS')
def signKeyPass   = keystoreProps['keyPassword'] ?: System.getenv('WORKLOG_KEY_PASSWORD')
def canSign = signStoreFile && signStorePass && signKeyAlias && signKeyPass \
    && rootProject.file(signStoreFile).exists()

android {
    namespace 'app.worklog.punch'
    compileSdk 37

    defaultConfig {
        applicationId 'app.worklog.punch'
        minSdk 24
        targetSdk 36
        versionCode 10
        versionName '1.2.6'
    }

    signingConfigs {
        if (canSign) {
            release {
                storeFile rootProject.file(signStoreFile)
                storePassword signStorePass
                keyAlias signKeyAlias
                keyPassword signKeyPass
                // Play requires v2 at minimum; v1 keeps pre-Nougat installs working
                // and costs nothing. minSdk is 24, so v1 is belt-and-braces.
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        debug {
            // signed with ~/.android/debug.keystore — sideload only, not for the Play Store
            minifyEnabled false
        }
        release {
            // ── R8은 꺼 두었습니다, 그리고 그것은 공짜가 아닙니다 ──
            // classes.dex는 2.7MB이고 앱 자체(assets)는 1.2MB입니다 — 코드가
            // 앱보다 큽니다. androidx의 biometric·fragment·activity가 딸려온
            // 것이고, R8을 켜면 상당 부분이 사라집니다.
            //
            // 그런데도 꺼 두는 이유는 하나입니다. 이 앱에서 자바가 하는 일은
            // 사실상 셋뿐인데(지문·파일 열기·파일 저장) 셋 다 이름으로 불립니다:
            // WebView가 @JavascriptInterface 메서드를 문자열로 찾고,
            // BioShim/FileShim이 window.WorkLogNative.<이름>을 부릅니다.
            // R8이 그 이름을 하나라도 바꾸면 출퇴근 패드가 press-and-hold로
            // 조용히 내려앉고, 근로자는 지문이 안 먹는다고만 느낍니다.
            //
            // proguard-rules.pro에 필요한 keep 규칙을 미리 써 두었습니다.
            // 켜려면 아래 두 줄을 true로 바꾸고 — 반드시 실제 폰에서 지문
            // 출퇴근과 백업 내보내기·불러오기를 손으로 확인하십시오.
            // 시험이 잡아 주지 못하는 자리입니다(자바에는 시험이 없습니다).
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // 서명 열쇠가 없으면 서명하지 않은 채로 빌드됩니다 — 빌드가 죽지는
            // 않습니다. 스토어에 올릴 물건인지 아닌지는 build_apk.sh가 말해 줍니다.
            if (canSign) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // the app is one big pre-compressed HTML file; leave it alone
    androidResources {
        noCompress 'html'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    // biometric 1.1.0 still pulls activity 1.1.0, which predates
    // registerForActivityResult — the backup file picker and the save sheet
    // both need it, so ask for versions that have it
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.fragment:fragment:1.8.5'
}
